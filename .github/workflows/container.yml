name: WayneClub website container

on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'website/**'
      - '.github/workflows/container.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Check JavaScript
        run: npm run check
      - name: Build static pages
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build CI container
        working-directory: ${{ github.workspace }}
        run: docker build --tag wayneclub-ci .
      - name: Start CI container
        working-directory: ${{ github.workspace }}
        run: |
          docker run --detach --name wayneclub-ci --publish 18940:80 wayneclub-ci
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:18940/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs wayneclub-ci
          exit 1
      - name: Browser tests
        run: npm test
      - name: Security and SEO tests
        run: BASE_URL=http://127.0.0.1:18940 npm run test:security
      - name: Accessibility tests
        run: BASE_URL=http://127.0.0.1:18940 npm run test:a11y
      - name: Remove CI container
        if: always()
        working-directory: ${{ github.workspace }}
        run: docker rm --force wayneclub-ci || true

  publish:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha
      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
